<!DOCTYPE html>
<html>
    <head>
         <meta charset="UTF-8">
         <style>
               *{
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
                  font-family: 'Courier New', Courier, monospace;
               }
               .age-container {
                   background: linear-gradient(135deg, #402af3, #13dcff);
                   height: 100vh;
                   width: 100%;
                   padding: 40px;
               }
               #calculatorJavascript h1{
                    color: white;
                    font-size: 4rem;
                    font-weight: 600;
                    font-family: Arial, Helvetica, sans-serif;
               }
               .input-box {
                   background: rgba(255,255,255,0.3);
                   width: 600px;
                   padding: 30px;
                   border-radius: 10px;

               }
               .input-box input {
                  width: 300px;
                  padding: 10px;
                  border-radius: 5px;
                  border: none;
                  cursor: pointer;
               }
               .input-box button {
                  background: #402af3;
                  width: 150px;
                  padding: 12px;
                  border-radius: 5px;
                  border: none;
                  color: white;
                  cursor: pointer;
                  font-size: 0.9rem;
                  font-weight: 600;
                  font-family: Arial, Helvetica, sans-serif;
               }
                
                
           .input-box input::-webkit-calender-picker-indicator {
               top: 0;
               left: 0;
               bottom: 0;
               right: 0;
               width: auto;
               height: auto;
               background-position: calc(100% - 10px);
               background-size: 30px;
               cursor: pointer;
           }
           #digitalClock {
             background:  linear-gradient(135deg, #65e965,#454545);
             display: flex;
             justify-content: center;
             align-items: center;
             height: 600px;
           }
           .clock-container {
              width: 400px;
              padding: 40px;
              border-radius: 20px;
              box-shadow: 0 4px 4px rgba(0,0,0,0.3);
              background: rgba(235, 5, 25, 0.3);
              display: flex;
              justify-content: center;
              align-items: center;
           }
           .clock-container span {
               font-family: 'Courier New', Courier, monospace;
               font-size: 4rem;
               font-weight: bold;
               color: white;
           }
         </style>
    </head>

    <body>
                    
                
        <div class="age-container">
            <div id="calculatorJavascript">
                <h1>javascript <br>age calculator</h1>
            </div>
            <div class="input-box">
                <input type="date" id="date">
                <button id="calculateBtn">calculate</button>
               
            </div>
             <h2 id="result"></h2>
        </div>
           <div id="digitalClock">
                <div class="clock-container">
                     <span id="hrs">00</span>
                     <span>:</span>
                     <span id="min">00</span>
                     <span>:</span>
                     <span id="sec">00</span>

          
                </div>
           </div>
        <script src="jp.js">
          
    
           
        </script>
    </body>
   

<html>
